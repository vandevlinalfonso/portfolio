<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lens-tpl="Lab · {title}">Lab · Security as Code</title>
  <meta name="description" content="Experimental UI playground: GPU embers, fluid ink, kinetic type. Bring a cursor.">
  <style>
    body { overflow: hidden; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---------- Switcher ---------- */

    #lab-ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 0 var(--margin) 30px;
      pointer-events: none;
    }

    #lab-hint {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--fg-faint);
      transition: opacity 0.5s ease;
      text-align: center;
    }

    #lab-tabs {
      display: flex;
      gap: 8px;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      pointer-events: auto;
    }

    #lab-tabs::-webkit-scrollbar { display: none; }

    #lab-tabs button {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: rgba(10, 10, 11, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      color: var(--fg-faint);
      padding: 12px 20px;
      cursor: pointer;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    #lab-tabs button:is(:hover, :focus-visible) { color: var(--fg); }

    /* inset: the scrolling strip would clip an outside ring */
    #lab-tabs button:focus-visible { outline-offset: -4px; }

    #lab-tabs button.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    #lab-title {
      position: fixed;
      top: 50%;
      left: var(--margin);
      transform: translateY(-50%);
      z-index: 30;
      pointer-events: none;
      writing-mode: vertical-rl;
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--fg-ghost);
      opacity: 0.7;
    }

    @media (max-width: 640px) {
      #lab-title { display: none; }
      #lab-ui { padding-left: 0; padding-right: 0; }
      #lab-hint { padding: 0 var(--margin); }
      #lab-tabs {
        align-self: stretch;
        justify-content: flex-start;
        padding: 0 var(--margin);
        scroll-padding-inline: var(--margin);
        scroll-snap-type: x mandatory;
      }
      #lab-tabs button { padding: 11px 13px; scroll-snap-align: center; }
    }
  </style>
</head>
<body>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <header class="frame-top">
    <div class="frame-id">
      <div class="case-id" data-lens-tpl="{file} · Annex">System 0001 · Annex</div>
      <div class="examiner">Lab · Experimental UI</div>
    </div>
    <nav class="frame-nav" aria-label="Pages">
      <a href="../../" data-lens-tpl="{home}">Home</a>
      <a href="../" class="active">Projects</a>
      <a href="../../cv/">Dossier</a>
      <a href="../../writeups/">Writeups</a>
    </nav>
  </header>

  <div id="lab-title">Experiment in progress · touch everything</div>

  <div id="stage"></div>

  <div id="lab-ui">
    <div id="lab-hint"></div>
    <div id="lab-tabs" role="tablist" aria-label="Experiments"></div>
  </div>

  <div id="webgl-fallback">
    <div class="inner">
      <h1>Hardware Acceleration Required</h1>
      <p>These experiments need WebGL. <a href="../">Back to projects</a>.</p>
    </div>
  </div>

  <script type="module" src="/src/lab.js"></script>
</body>
</html>
